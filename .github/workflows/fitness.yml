name: fitness-functions

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  arquitectura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install import-linter pytest matplotlib

      - name: Validar arquitectura estructural (import-linter)
        run: PYTHONPATH=.:src lint-imports

      - name: Validar fitness functions de calidad (pytest)
        run: PYTHONPATH=.:src pytest -v tests/test_fitness.py
